services:
  - type: web
    runtime: static
    name: replay-york
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: "22.18.0"
    routes:
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
